[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "autographql"
version = "0.1.0"
description = "Schema-driven generation of NL2GraphQL datasets from a GraphQL schema"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Keya Battu" },
  { name = "Parth Mehta" },
  { name = "Harikrishnan Balagopal" },
  { name = "Manish Kesarwani" },
]
keywords = ["graphql", "nl2graphql", "dataset-generation", "synthetic-data", "benchmark"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # Schema parsing and query construction. Pinned below 3.3: from 3.3 a node's
  # `directives` is None when absent where 3.2 returned [], which breaks AST
  # walking shared with the evaluation package.
  "graphql-core>=3.2,<3.3",
]

[project.optional-dependencies]
# Writing generated datasets to xlsx.
datasets = ["pandas>=2.0", "openpyxl>=3.1"]
# The Dataset Generator and Dataset Explorer UI under website/.
web = ["fastapi>=0.100", "uvicorn[standard]>=0.22", "python-multipart>=0.0.6"]
dev = ["pytest>=7", "build>=1.0", "twine>=5.0"]

[project.urls]
Homepage = "https://nl2graphql-bench.github.io/"
Repository = "https://github.com/nl2graphql-bench/generation"
Datasets = "https://github.com/nl2graphql-bench/datasets"
Issues = "https://github.com/nl2graphql-bench/generation/issues"

[project.scripts]
autographql-generate = "autographql.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autographql"]

[tool.hatch.build.targets.sdist]
include = ["src/autographql", "README.md", "LICENSE", "pyproject.toml"]
